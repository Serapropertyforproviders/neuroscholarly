<style>
/* Layout: white, spacious marketplace. Search first, then benefits, then mission. Blue + yellow core; six circle colours only in the three circle groups. Single light theme by brief ("white background only"). */
:root{
  --bg:#FFFFFF; --ink:#14213D; --muted:#56617A; --line:#E3E8F2; --soft:#F5F8FE;
  --blue:#1D44A8; --blue-deep:#0F2A6B; --blue-soft:#EAF0FC; --yellow:#FFC527; --yellow-deep:#E8A800; --yellow-soft:#FFF6D9;
  --c-blue:#2D5BD7; --c-yellow:#FFC527; --c-green:#2E9E62; --c-purple:#7A4BC9; --c-orange:#F2832B; --c-red:#D93A4A;
  --ok:#2E9E62;
  --font:"Inter", "Segoe UI", system-ui, sans-serif; --display:"Plus Jakarta Sans", "Inter", "Segoe UI", system-ui, sans-serif;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
h1,h2,h3,h4{margin:0;color:var(--blue-deep);line-height:1.12;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(2.3rem,5.6vw,4rem);font-weight:800}
h2{font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:700}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.center{text-align:center;align-items:center}
.hl{background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 90%,transparent 90%);padding:0 .1em}
.tm{font-size:.55em;vertical-align:super;font-weight:500}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font-weight:700;font-size:1.3rem;color:var(--blue-deep);letter-spacing:-.02em}
.logo b span{color:var(--yellow-deep)}
nav.main{display:flex;gap:0;margin-left:auto}
nav.main button{border:0;background:none;padding:8px 8px;border-radius:10px;cursor:pointer;font-weight:500;font-size:.92rem;color:var(--ink);white-space:nowrap}
nav.main button:hover{background:var(--blue-soft)}
nav.main button[aria-current="page"]{color:var(--blue);box-shadow:inset 0 -3px 0 var(--yellow)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;place-items:center}
.burger svg{width:22px;height:22px}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(15,42,107,.35);display:flex;justify-content:flex-end}
.drawer .panel-d{background:#fff;width:min(340px,88vw);height:100%;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.drawer button.item{border:0;background:none;text-align:left;padding:14px 12px;border-radius:12px;font-weight:600;font-size:1.05rem;cursor:pointer;color:var(--blue-deep)}
.drawer button.item:hover{background:var(--blue-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 24px;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(29,68,168,.55)}
.btn.blue{background:var(--blue);color:#fff}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--blue-deep)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;text-decoration:underline;text-underline-offset:4px}
.btn.sm{min-height:40px;padding:6px 16px;font-size:.92rem;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* hero */
.hero{position:relative;overflow:hidden}
.swoosh{position:absolute;right:-120px;top:-40px;width:760px;max-width:none;pointer-events:none;opacity:.95}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:56px 64px;position:relative}
.hero-text{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero-text .lede{font-size:1.2rem;color:var(--muted);max-width:40ch}
.search-card{background:var(--blue);border-radius:22px;padding:22px;color:#fff;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 48px -24px rgba(15,42,107,.6)}
.search-card h3{color:#fff;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.search-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.search-card label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:500;color:#DCE5FA}
.search-card select,.search-card input{background:#fff;color:var(--ink);border:0}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:600;color:var(--blue-deep);font-size:.95rem}
.trust span{display:inline-flex;gap:8px;align-items:center}
.tick{width:22px;height:22px;border-radius:50%;background:var(--yellow);display:inline-grid;place-items:center;color:var(--blue-deep);font-size:.75rem;font-weight:800;flex:none}
.hero-visual{position:relative;min-height:440px}
.photo-blob{position:absolute;inset:20px 10px 30px 40px;border-radius:46% 54% 42% 58%/52% 44% 56% 48%;overflow:hidden;box-shadow:0 30px 60px -30px rgba(15,42,107,.5);border:6px solid #fff}
.photo-blob img{width:100%;height:100%;object-fit:cover}
.float{position:absolute;background:#fff;border-radius:16px;box-shadow:0 18px 40px -16px rgba(15,42,107,.35);padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:.88rem;border:1px solid var(--line)}
.float b{color:var(--blue-deep);display:block}
.float .av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.float.f1{left:0;bottom:30px}
.float.f2{right:0;top:20px}
.float.f3{right:14px;bottom:0}
.bar{height:8px;border-radius:999px;background:var(--blue-soft);overflow:hidden;width:130px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--blue))}

/* sections */
section.band{padding-block:72px}
section.band.soft{background:var(--soft)}
section.band.blue{background:var(--blue-deep);color:#fff}
section.band.blue h2,section.band.blue h3{color:#fff}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;max-width:720px}
.sec-head.center{margin-inline:auto;text-align:center;align-items:center}

/* benefit cards */
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px}
.bcard .ic{font-weight:800;color:var(--blue);font-size:1.2rem;width:48px;height:48px;border-radius:14px;background:var(--yellow-soft);display:grid;place-items:center;color:var(--blue)}
.bcard .ic svg{width:26px;height:26px}
.bcard h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.03em}

/* circles: only in the three circle groups */
.circles{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:22px;justify-items:center}
.circle{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:210px;border:0;background:none;padding:0;color:inherit}
button.circle{cursor:pointer}
.disc{width:min(100%,170px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:18px;color:#fff;font-weight:700;font-size:1rem;line-height:1.2;letter-spacing:.01em;text-transform:uppercase;box-shadow:0 18px 30px -18px rgba(0,0,0,.45);transition:transform .2s}
button.circle:hover .disc{transform:scale(1.04)}
.disc.blue{background:var(--c-blue)} .disc.yellow{background:var(--c-yellow);color:var(--blue-deep)} .disc.green{background:var(--c-green)} .disc.purple{background:var(--c-purple)} .disc.orange{background:var(--c-orange)} .disc.red{background:var(--c-red)}
.circle .cl{font-size:.95rem;color:var(--muted)}
section.band.blue .circle .cl{color:#C9D5F2}
.circle .sub{font-size:.82rem;font-weight:600;color:var(--blue)}

/* chain */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-weight:600;color:var(--blue-deep)}
.chain span{background:var(--yellow-soft);padding:6px 14px;border-radius:999px}
.chain i{font-style:normal;color:var(--yellow-deep)}

/* steps */
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:var(--r);background:#fff;border:1px solid var(--line);position:relative}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;font-size:1.1rem}
.step:nth-child(2n) .n{background:var(--yellow);color:var(--blue-deep)}

/* split feature */
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.feature-card{background:var(--blue-deep);color:#fff;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.feature-card h3,.feature-card h2{color:#fff}
.feature-card .price{font-size:2.4rem;font-weight:800;color:var(--yellow)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:6px 14px;border-radius:999px;background:var(--blue-soft);color:var(--blue-deep);font-size:.88rem;font-weight:500}
.feature-card .pill{background:rgba(255,255,255,.12);color:#fff}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--yellow);color:var(--blue-deep)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:#E3F5EC;color:var(--ok)}

/* tutor cards */
.find{display:grid;grid-template-columns:290px 1fr;gap:28px;padding-block:32px}
.filters{display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.find main{min-width:0;display:flex;flex-direction:column;gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.hint{font-weight:400;color:var(--muted);font-size:.86rem}
input[type=text],input[type=email],input[type=search],input[type=tel],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,68,168,.18)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin-top:2px}
.tcard{display:grid;grid-template-columns:120px 1fr auto;gap:20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;align-items:start}
.tcard:hover{border-color:#C9D5F2;box-shadow:0 14px 30px -20px rgba(15,42,107,.4)}
.ph{width:120px;height:120px;border-radius:16px;object-fit:cover;display:grid;place-items:center;font-size:2.2rem;font-weight:700;color:#fff;flex:none}
.tcard .mid{display:flex;flex-direction:column;gap:8px;min-width:0}
.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;font-size:.88rem;list-style:none;padding:0;margin:0}
.ticks li{display:flex;gap:6px;align-items:baseline}
.ticks li::before{content:"✓";color:var(--ok);font-weight:800}
.tcard .side{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:190px}
.rate{font-size:1.7rem;font-weight:800;color:var(--blue-deep)}
.rate small{font-size:.9rem;font-weight:500;color:var(--muted)}
.free{background:var(--yellow-soft);color:var(--blue-deep);font-weight:700;font-size:.82rem;padding:6px 10px;border-radius:10px;text-align:center}
.stars{color:#F2A900;letter-spacing:1px}
.save{border:0;background:none;cursor:pointer;color:var(--muted);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.save[aria-pressed="true"]{color:var(--c-red)}

/* profile */
.prof{display:grid;grid-template-columns:1fr 360px;gap:32px;padding-block:36px}
.prof-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.prof-head .ph{width:140px;height:140px;border-radius:24px}
.block{border-top:1px solid var(--line);padding-top:22px;display:flex;flex-direction:column;gap:10px}
.book-card{position:sticky;top:96px;align-self:start;border:2px solid var(--blue);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;font-size:.78rem;display:flex;flex-direction:column;gap:4px}
.day b{font-size:.85rem;color:var(--blue-deep)}
.slot{border:1px solid var(--blue-soft);background:var(--blue-soft);color:var(--blue);border-radius:8px;font-size:.74rem;padding:4px 0;cursor:pointer;font-weight:600}
.slot[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.slot.none{background:none;border:0;color:var(--muted);cursor:default;font-weight:400}

/* table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line)}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--soft)}
td.num{font-weight:700;color:var(--blue-deep);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.li{border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;color:var(--blue-deep);display:flex;gap:10px;align-items:center;background:#fff}
.li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--yellow);flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}

/* final */
.final{background:var(--blue-deep);color:#fff;border-radius:28px;padding:56px 32px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;position:relative;overflow:hidden}
.final h2{color:#fff}
.final .lines{display:flex;flex-direction:column;gap:4px;color:#C9D5F2;font-size:1.05rem}
.final .big{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;color:var(--yellow);max-width:24ch;line-height:1.2}

/* account */
.acct{display:grid;grid-template-columns:250px 1fr;gap:24px;padding-block:32px}
.side-nav{display:flex;flex-direction:column;gap:2px;background:var(--blue-deep);border-radius:var(--r);padding:12px;align-self:start}
.side-nav button{border:0;background:none;color:#DCE5FA;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500}
.side-nav button[aria-current="true"]{background:var(--blue);color:#fff;box-shadow:inset 3px 0 0 var(--yellow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:1.8rem;color:var(--blue-deep);font-variant-numeric:tabular-nums}
.lesson{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.lesson .when{background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;text-align:center;min-width:70px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,42,107,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:26px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--blue-deep);color:#fff;padding:12px 22px;border-radius:999px;z-index:90;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}

footer.foot{border-top:1px solid var(--line);margin-top:72px}
footer.foot .wrap{padding-block:40px;display:flex;flex-direction:column;gap:22px}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot-links button{border:0;background:none;padding:2px 0;cursor:pointer;color:var(--muted);font-size:.92rem}
.foot-links button:hover{color:var(--blue);text-decoration:underline}

@media (max-width:1440px){.jl{display:none}}
@media (max-width:980px){nav.main{display:none}.burger{display:grid}.hdr-actions{margin-left:auto}}
header.top .wrap{min-width:0}.logo{flex:none}
@media (max-width:980px){
  .hero-grid,.split,.prof,.find,.acct{grid-template-columns:1fr}
  .hero-visual{min-height:380px}
  .cards4,.steps4{grid-template-columns:repeat(2,1fr)}
  .circles{grid-template-columns:repeat(3,1fr)}
  .filters,.book-card{position:static}
  .swoosh{width:520px;right:-180px;opacity:.5}
}
@media (max-width:640px){
  section.band{padding-block:52px}
  .search-fields{grid-template-columns:1fr}
  .cards4,.steps4{grid-template-columns:1fr}
  .circles{grid-template-columns:repeat(2,1fr);gap:18px}
  .disc{font-size:.86rem;padding:14px}
  .tcard{grid-template-columns:80px 1fr}
  .tcard .ph{width:80px;height:80px;font-size:1.6rem}
  .tcard .side{grid-column:1/-1;min-width:0}
  .tiles{grid-template-columns:1fr 1fr}
  .hdr-actions .hide-sm{display:none}
  .logo b{font-size:1.1rem}.logo svg{width:32px;height:32px}header.top .wrap{gap:10px}
  .float{font-size:.8rem;padding:10px}
  .float.f2{top:0}
  .hero-visual{min-height:330px}
  .photo-blob{inset:24px 0 40px 0}
  .cal{gap:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- premium layer ---- */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1{font-weight:700;letter-spacing:-.035em}
h2{letter-spacing:-.025em}
.eyebrow{display:inline-flex;align-items:center;gap:10px}

 <div class="sec-head center"><p class="eyebrow">How it works</p><h1 style="font-size:clamp(2.2rem,5vw,3.2rem)">Simple from the first search.</h1><p class="muted">No diagnosis required. No commitment until you've tried.</p></div>

const LADDER=[["Foundation",20,"Where everyone starts. Just teach."],["Contributor",15,"You've started helping us grow."],["Ambassador",10,"You regularly bring people in."],["Growth Partner",7,"You're helping build NeuroScholarly."],["NeuroScholarly Partner",5,"Our closest partners."]];
const REQ_ROWS=[["Paying families referred",[0,5,10,20,35]],["Tutors referred and verified",[0,0,2,5,10]],["Outreach sessions run",[0,0,1,2,4]],["Pioneers mentored for a term",[0,0,0,1,2]],["Approved projects led",[0,0,0,0,1]]];

function pioneerBasics(){return`<div class="basics">
 <div class="panel" style="background:#fff;margin-bottom:18px"><h2 style="font-size:1.5rem;margin-bottom:6px">What's a Pioneer?</h2><p>It's simply what we call every tutor and specialist on NeuroScholarly. Families search for a tutor; when you join to teach, you become a Pioneer. Every Pioneer has two things: a <b>Pioneer Type</b> and a <b>Contribution Level</b>.</p></div>
 <div class="panel" style="background:var(--yellow-soft);border:1px solid #F7E2A0;margin-bottom:18px;text-align:center"><p style="font-weight:600;color:var(--blue-deep)">Think of a footballer: their <u>position</u> is who they are, their <u>bonus level</u> is what they achieve. Pioneer Type and Contribution Level work the same way, and they're completely separate.</p></div>
 <div class="split" style="align-items:start;margin-bottom:18px">
  <div class="panel stack" style="gap:10px"><span class="badge blue" style="align-self:flex-start">Pioneer Type · who you are</span><h3>Set by your education and experience</h3>
   <div class="stack" style="gap:6px">${Object.entries(PCOL).map(([t,[c]])=>`<div class="row" style="gap:10px;flex-wrap:nowrap"><i style="width:14px;height:14px;border-radius:50%;background:${c};flex:none"></i><span><b>${t.replace(' Pioneer','')}:</b> ${({"Young Pioneer":"sixth form or equivalent","University Pioneer":"a current university student","Professional Pioneer":"a graduate or qualified professional","Experienced Pioneer":"a postgraduate, researcher or senior professional"})[t]}</span></div>`).join('')}</div>
   <ul class="ticks" style="grid-template-columns:1fr;font-size:.92rem"><li>Decides your kit colour and what you can teach</li><li>Changes only when your qualifications change, e.g. a Young Pioneer becomes a University Pioneer when they start university</li><li><b>Does not</b> change your commission</li></ul></div>
  <div class="panel stack" style="gap:10px;border-top:5px solid var(--yellow)"><span class="badge" style="align-self:flex-start">Contribution Level · what you do</span><h3>Earned by helping NeuroScholarly grow</h3><p class="muted">Each level has fixed targets: paying families you refer, tutors you bring in, outreach, mentoring and projects. Hit every target for a level and you move up.</p>
   <ul class="ticks" style="grid-template-columns:1fr;font-size:.92rem"><li>Decides your commission, from 20% down to 5%</li><li>Reviewed every 3 months</li><li>Open to every Pioneer Type equally</li></ul></div>
 </div>
 <div class="trial-note" style="margin-bottom:28px"><span class="tick">✓</span><span><b>Example:</b> a University Pioneer who refers lots of tutors could reach Ambassador and pay 10%. An Experienced Pioneer who only teaches stays at Foundation and pays 20%. Type and level don't affect each other.</span></div>
 <div class="row" style="justify-content:center;gap:10px"><button class="btn sm" data-go="levels">See the Contribution Levels</button><button class="btn sm blue" data-ptype="">Apply to become a Pioneer</button></div></div>`}
function levelsBlock(){return`<div class="sec-head center"><p class="eyebrow">Contribution Levels explained</p><h2>Help us grow. Pay less commission.</h2><p class="muted">Most platforms charge everyone the same. At NeuroScholarly, the more you help us reach young people, the more of your earnings you keep.</p></div>
 <div class="ladder5" role="list">${LADDER.map(([l,c,d],i)=>`<div class="rung" role="listitem" style="--h:${60+i*22}px"><div class="barwrap"><div class="bar5"><b>${c}%</b><span>commission</span></div></div><h3>${l}</h3><span class="small muted">${i===0?'Start here':REQ_ROWS[0][1][i]+' paying families +'}</span><p class="small">${d}</p></div>`).join('')}</div>
 <h3 style="margin:36px 0 12px">Exactly what each level needs</h3>
 <div class="tbl"><table class="reqtab"><thead><tr><th>In the last 12 months</th>${LADDER.map(([l,c])=>`<th>${l}<br><span class="pc">${c}%</span></th>`).join('')}</tr></thead><tbody>${REQ_ROWS.map(([n,v])=>`<tr><td>${n}</td>${v.map((x,i)=>`<td class="num">${i===0?'—':x?x:'—'}</td>`).join('')}</tr>`).join('')}<tr><td>Average rating</td><td class="num">—</td>${[1,2,3,4].map(()=>'<td class="num">4.5★+</td>').join('')}</tr></tbody></table></div>
 <p class="small muted" style="margin-top:8px">You need <b>every</b> target in a column to reach that level. NeuroScholarly Partner also needs a signed partner agreement.</p>
 <div class="split" style="align-items:start;margin-top:28px">
  <div class="stack" style="gap:12px"><h3>What counts</h3><ul class="ticks" style="grid-template-columns:1fr;font-size:.95rem;gap:8px">
   <li><span><b>Paying family:</b> a new family who signs up with your referral link or code and completes at least 3 paid lessons with any NeuroScholarly tutor.</span></li>
   <li><span><b>Tutor referred:</b> someone who joins with your referral link, passes verification and completes 5 paid sessions.</span></li>
   <li><span><b>Outreach session:</b> a talk or workshop at a school, college, university or community group, agreed with us in advance.</span></li>
   <li><span><b>Mentoring:</b> supporting a newer Pioneer for a full school term, agreed with us in advance.</span></li>
   <li><span><b>Project:</b> a piece of work for NeuroScholarly that we've approved in writing.</span></li></ul></div>
  <div class="stack" style="gap:12px"><h3>The rules</h3><ul class="ticks" style="grid-template-columns:1fr;font-size:.95rem;gap:6px"><li>Everyone starts at Foundation.</li><li>Your progress is counted over the last 12 months, and you can track it in your dashboard.</li><li>We review levels every 3 months. A new level applies from your next payout.</li><li>If you fall below your level's targets, you move down no more than one level at a time.</li><li>Your own lessons don't count towards targets, and you don't need to contribute at all. You can stay at Foundation and just teach.</li><li>If we change the targets, we tell you in writing at least 15 days before.</li></ul>
   <div class="trial-note"><span class="tick">✓</span><span><b>Example:</b> Aisha refers 10 families who each complete 3+ paid lessons, brings in 2 verified tutors and runs 1 school talk. She meets every Ambassador target, so from her next payout she pays 10% instead of 20%.</span></div></div>
 </div>`}

function feesBlock(){return`<div class="sec-head center"><p class="eyebrow">Fees &amp; earnings</p><h2>Exactly what you earn. No surprises.</h2><p class="muted">You set your own price. We take a commission only when you're paid. The only other cost is the one-off £49.00 face-to-face kit, and only if you teach in person.</p></div>

 if(/Password should|weak password/i.test(m))return'Please choose a stronger password: at least 8 characters with letters and numbers.';
 if(/rate limit|too many|security purposes/i.test(m)||s===429)return'Too many attempts. Please wait a few minutes and try again.';
 if(/row-level security|permission denied|Not allowed/i.test(m))return'Sorry, you don’t have permission to do that.';

/* ---- photo resize ---- */
function resizePhoto(file){return new Promise((res,rej)=>{if(!/^image\//.test(file.type)){rej(new Error('Please choose a photo (JPG or PNG).'));return}if(file.size>15*1024*1024){rej(new Error('That photo is over 15 MB. Please choose a smaller one.'));return}
 const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const sz=600,c=document.createElement('canvas');c.width=c.height=sz;const s=Math.max(sz/im.width,sz/im.height),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sz,sz);x.drawImage(im,(sz-im.width*s)/2,(sz-im.height*s)/2,im.width*s,im.height*s);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(new Error('Couldn’t read that photo.')),'image/jpeg',.86)};im.onerror=()=>rej(new Error('Couldn’t read that photo. Try a JPG or PNG.'));im.src=u})}

/* ---- busy buttons ---- */
async function busy(btn,fn,label='Saving…'){if(btn){if(btn.disabled)return;btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent=label}
 try{return await fn()}catch(e){toast(e.message||'Something went wrong');throw e}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=btn.dataset.t}}}

const TZ='Europe/London';
function ldnParts(d){const o={};new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value);
 return{y:+o.year,m:+o.month,d:+o.day,h:+o.hour,mi:+o.minute,dow:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(o.weekday)+1}}
function ldnToDate(y,m,d,h,mi){let g=Date.UTC(y,m-1,d,h,mi);for(let i=0;i<2;i++){const p=ldnParts(new Date(g));g-=Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)-Date.UTC(y,m-1,d,h,mi)}return new Date(g)}
const fmtWhen=iso=>new Date(iso).toLocaleString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

function sessStatus(s){if(s.status==='confirmed'&&new Date(s.starts_at)<new Date())return`<span class="badge sb-st grey">Completed</span>`;const [l,c]=SSTAT[s.status]||[s.status,'grey'];return`<span class="badge sb-st ${c}">${l}</span>`}
function icsFor(s){const st=new Date(s.starts_at),en=new Date(st.getTime()+s.minutes*60000),f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const title=`NeuroScholarly: ${s.subject} – ${s.as==='tutor'?s.learner||s.family:s.tutor}`,desc=`${SKIND[s.kind]} (${s.mode==='online'?'online':'in person'}).${s.zoom_link?' Join the lesson: '+s.zoom_link:''} A parent or carer must be present for learners under 18. Manage at https://neuroscholarly.com/#account`;
 return{title,desc,start:f(st),end:f(en),loc:s.mode==='online'?(s.zoom_link||'Online'):(s.area||'In person')}}

function sessionsList(){const S=ME.sessions||[],now=new Date(),act=S.filter(s=>['pending','confirmed'].includes(s.status)&&new Date(s.starts_at)>now),past=S.filter(s=>!act.includes(s)).reverse().slice(0,10);

async function loadBook(id){const r=(ME.requests||[]).find(x=>x.id===id&&x.as==='family');if(!r)throw new Error('Request not found');
 const [t,av,busyT]=await Promise.all([sb(`/rest/v1/tutors?id=eq.${r.tutor.id}&select=*`,{anon:true}),sb(`/rest/v1/tutor_availability?tutor_id=eq.${r.tutor.id}&select=*`,{anon:true}),rpc('tutor_busy',{tutor:r.tutor.id})]);
 BOOK={r,t:t[0],avail:av||[],busy:(busyT||[]).map(b=>[new Date(b.starts_at).getTime(),new Date(b.starts_at).getTime()+b.minutes*60000])}}
function bookSlots(mins){const out={},now=Date.now(),start=new Date();
 for(let i=0;i<21;i++){const day=new Date(start.getTime()+i*864e5),p=ldnParts(day),key=`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
  BOOK.avail.filter(a=>a.weekday===p.dow).forEach(a=>{const [sh,sm]=hhmm(a.start_time).split(':').map(Number),[eh,em]=hhmm(a.end_time).split(':').map(Number);
   for(let m=sh*60+sm;m+mins<=eh*60+em;m+=30){const d=ldnToDate(p.y,p.m,p.d,Math.floor(m/60),m%60),t0=d.getTime(),t1=t0+mins*60000;
    if(t0<now+12*3600e3)continue;if(BOOK.busy.some(([b0,b1])=>t0<b1&&t1>b0))continue;(out[key]=out[key]||[]).push(d)}})}
 Object.values(out).forEach(a=>a.sort((x,y)=>x-y));return out}
function vBook(id){if(!SESSION)return needLogin();if(need('me',loadMe)!=='ok')return`<div class="wrap">${spinner()}</div>`;

 const first=r.trial_type==='taster'?'taster':'trial',kinds=used?['lesson']:[first,'lesson'];if(!kinds.includes(BK.kind))BK.kind=kinds[0];
 const modes=t.lesson_mode==='both'?['online','in_person']:[t.lesson_mode];if(!modes.includes(BK.mode))BK.mode=modes[0];

 const slots=bookSlots(SMINS[BK.kind]),days=Object.keys(slots).sort();if(!days.includes(BK.day)){BK.day=days[0]||'';BK.slot=''}
 const top=`<div class="wrap" style="padding-block:28px;max-width:760px"><button class="btn ghost sm" data-go="account" style="padding:0;align-self:flex-start">← My account</button>
 <div class="row" style="gap:14px">${tPhoto(t,'av sb-av')}<div><p class="eyebrow">Book a session</p><h1 style="font-size:clamp(1.6rem,4vw,2.2rem)">${esc(t.display_name)}</h1><p class="small muted">${esc(r.subject)}${r.learner?.first_name?' · for '+esc(r.learner.first_name):''}</p></div></div>`;

 return top+`<form class="panel stack" id="sb_book" data-req="${r.id}" style="gap:16px;max-width:none" novalidate>
 <div class="stack" style="gap:8px;max-width:none"><b>1. Type of session</b><div class="sb-opts">${kinds.map(k=>`<button type="button" class="sb-opt" aria-pressed="${BK.kind===k}" data-sb="bk" data-f="kind" data-v="${k}"><b>${SKIND[k]}</b><span>${price(k)}</span></button>`).join('')}</div></div>
 ${modes.length>1?`<div class="stack" style="gap:8px;max-width:none"><b>2. Online or in person?</b><div class="sb-opts">${modes.map(m=>`<button type="button" class="sb-opt" aria-pressed="${BK.mode===m}" data-sb="bk" data-f="mode" data-v="${m}"><b>${m==='online'?'Online (video call)':'In person'}</b>${m==='in_person'&&t.area?`<span>${esc(t.area)}</span>`:''}</button>`).join('')}</div></div>`:''}
 <div class="stack" style="gap:8px;max-width:none"><b>${modes.length>1?3:2}. Choose a day</b>${days.length?`<div class="sb-days">${days.map(k=>{const d=slots[k][0];return`<button type="button" class="sb-day" aria-pressed="${BK.day===k}" data-sb="bk" data-f="day" data-v="${k}"><span>${d.toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short'})}</span><b>${d.toLocaleDateString('en-GB',{timeZone:TZ,day:'numeric'})}</b><span>${d.toLocaleDateString('en-GB',{timeZone:TZ,month:'short'})}</span></button>`}).join('')}</div>`:`<p class="sb-msg" style="margin:0">No free times in the next 3 weeks for this session length. Try another type, or <button type="button" class="btn ghost sm" data-thread="${r.id}" style="padding:0;min-height:0">message ${esc(firstName(t.display_name))}</button>.</p>`}</div>
 ${BK.day?`<div class="stack" style="gap:8px;max-width:none"><b>${modes.length>1?4:3}. Choose a time <span class="hint">(UK time)</span></b><div class="sb-times">${slots[BK.day].map(d=>`<button type="button" class="sb-time" aria-pressed="${BK.slot===d.toISOString()}" data-sb="bk" data-f="slot" data-v="${d.toISOString()}">${fmtTime(d)}</button>`).join('')}</div></div>`:''}
 <label class="f">Anything the tutor should know? <span class="hint">Optional. Please don’t include phone numbers or emails.</span><textarea id="bk_note" maxlength="500" rows="2"></textarea></label>
 ${BK.slot?`<div class="sb-msg ok" style="margin:0"><b>${SKIND[BK.kind]}</b> on <b>${fmtWhen(BK.slot)}</b>, ${BK.mode==='online'?'online':'in person'} · ${price(BK.kind)}</div>`:''}

function confirmInline(btn,msg){if(btn.dataset.armed){delete btn.dataset.armed;return true}btn.dataset.armed='1';const old=btn.textContent;btn.textContent=msg;setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=old}},4000);return false}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='tf_q'){TF.q=t.value;const box=$('#sb_results');if(box){const l=TUTORS.filter(tutorMatches);box.innerHTML=l.length?l.map(liveCard).join(''):`<div class="panel stack"><h3>No tutors match yet</h3><p class="muted">Try another search, or <button type="button" class="btn ghost sm" data-go="request" style="padding:0;min-height:0">tell us what you need</button>.</p></div>`}return}
 if(t.id==='tp_bio'){const c=$('#tp_bioc');if(c)c.textContent=t.value.length+'/1200'}
 if(t.id==='tp_rate'){const h=$('#tp_fam');if(h)h.textContent=+t.value?'Families see '+gbp2(famPrice(+t.value))+' an hour, including NeuroScholarly’s service fee. You receive 100% of your rate.':'You receive 100% of this. Families see it with NeuroScholarly’s service fee added.'}},true);
document.addEventListener('change',async e=>{const t=e.target;
 if(['tf_subject','tf_spec','tf_mode'].includes(t.id)){TF[t.id.slice(3)]=t.value;render();return}
 if(t.id==='tp_type'){const g=$('#tp_guide');if(g)g.textContent=t.value?'Typical for '+PTYPES[t.value]+'s: '+PGUIDE[t.value]+' (guide only)':''}
 if(t.id==='tp_mode'){$('#tp_areaw').hidden=t.value==='online'}
 if(t.id==='rq_learner'){$('#rq_new').hidden=t.value!=='new'}
 if(t.id==='tp_photo'&&t.files[0]){try{NEWPHOTO=await resizePhoto(t.files[0]);const img=t.closest('form').querySelector('.sb-photo-row .ph');if(img){const n=document.createElement('img');n.className='ph sb-big';n.src=NEWPHOTO.url;n.alt='Your new profile photo';img.replaceWith(n)}toast('Photo ready. Tap Save to upload it.')}catch(err){toast(err.message)}}},true);

/* ---- forms ---- */
document.addEventListener('submit',async e=>{const f=e.target;if(!f.id||!f.id.startsWith('sb_'))return;e.preventDefault();e.stopImmediatePropagation();const btn=f.querySelector('button[type=submit]');
 try{switch(f.id){
 case'sb_login':{const em=fv(f,'sl_email'),pw=$('#sl_pw').value;if(!emailOK(em)||!pw){toast('Enter your email and password');return}
  const s=await busy(btn,()=>sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email:em,password:pw},anon:true}),'Logging in…');setSession(s);LOAD={};ME=null;const nx=ss.get('ns_after_login');ss.set('ns_after_login',null);go(nx||'account');toast('Welcome back');break}
 case'sb_signup':{const name=fv(f,'su_name'),em=fv(f,'su_email'),pw=$('#su_pw').value;
  if(name.length<2){toast('Please add your full name');return}if(!emailOK(em)){toast('Please enter a valid email');return}
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){toast('Password: at least 8 characters, with letters and numbers');return}
  if(!$('#su_age').checked||!$('#su_terms').checked){toast('Please tick both boxes to continue');return}
  const r=await busy(btn,()=>sb('/auth/v1/signup?redirect_to='+encodeURIComponent(SITE_URL),{method:'POST',body:{email:em,password:pw,data:{role:SIGNUP_ROLE,name}},anon:true}),'Creating…');
  if(SIGNUP_ROLE==='tutor')notify('New Pioneer sign-up: '+name,{Type:'New Pioneer account',Name:name,Email:em});
  if(r&&r.access_token){setSession(r);LOAD={};go('account');toast('Welcome to NeuroScholarly')}else if(r&&Array.isArray(r.identities)&&!r.identities.length){go('login');setTimeout(()=>{const i=$('#sl_email');if(i)i.value=em},0);toast('There’s already an account with that email. Please log in, or use a different email.')}else{ss.set('ns_pending_email',em);go('checkemail')}break}
 case'sb_forgot':{const em=fv(f,'sf_email');if(!emailOK(em)){toast('Please enter a valid email');return}await busy(btn,()=>sb('/auth/v1/recover?redirect_to='+encodeURIComponent(SITE_URL),{method:'POST',body:{email:em},anon:true}),'Sending…');f.innerHTML=okBox('Check your email',`If there’s an account for <b>${esc(em)}</b>, we’ve sent a link to reset your password.`);break}
 case'sb_newpw':case'sb_chpw':{const p1=f.querySelector('input').value,p2=f.id==='sb_newpw'?$('#np_2').value:p1;if(p1.length<8||!/[A-Za-z]/.test(p1)||!/\d/.test(p1)){toast('Password: at least 8 characters, with letters and numbers');return}if(p1!==p2){toast('The passwords don’t match');return}
  await busy(btn,()=>sb('/auth/v1/user',{method:'PUT',body:{password:p1}}));toast('Password updated');if(f.id==='sb_newpw')go('account');else f.reset();break}
 case'sb_tprof':{const name=fv(f,'tp_name'),type=fv(f,'tp_type'),subs=[...vals(f,'tp_subj'),...fv(f,'tp_other').split(',').map(s=>s.trim()).filter(Boolean)].slice(0,30),lv=vals(f,'tp_lvl'),rate=+fv(f,'tp_rate'),mode=fv(f,'tp_mode'),area=fv(f,'tp_area'),trial=f.querySelector('input[name=tp_trial]:checked').value,bio=$('#tp_bio').value.trim();
  if(name.length<2){toast('Add the name families will see');return}if(!type){toast('Choose your Pioneer type');return}if(!subs.length){toast('Choose at least one subject');return}if(!lv.length){toast('Choose at least one age or level');return}
  if(!(rate>=5&&rate<=250)){toast('Add your hourly rate (£5–£250)');return}if(mode!=='online'&&!area){toast('Add your town or area for in-person lessons');return}if(bio.length<40){toast('Tell families a little more about you (at least a couple of sentences)');return}
  if(CONTACT_RE.test(bio)){toast('Please remove phone numbers, emails and social media from “About you”');return}
  if(!NEWPHOTO&&!ME.tutor?.photo_url){toast('Please add a profile photo');return}
  await busy(btn,async()=>{let photo=ME.tutor?.photo_url||null;
   if(NEWPHOTO){const path=`${ME.uid}/${Date.now()}.jpg`;await sb('/storage/v1/object/tutor-photos/'+path,{method:'POST',body:NEWPHOTO.blob,headers:{'Content-Type':'image/jpeg','x-upsert':'false','cache-control':'max-age=31536000'}});
    const old=ME.tutor?.photo_url;photo=SB.url+'/storage/v1/object/public/tutor-photos/'+path;
    if(old&&old.includes('/tutor-photos/')){sb('/storage/v1/object/tutor-photos/'+old.split('/tutor-photos/')[1],{method:'DELETE'}).catch(()=>{})}}
   const row={display_name:name,pioneer_type:type,subjects:subs,levels:lv,specialisms:vals(f,'tp_spec'),bio,hourly_rate:rate,trial_type:trial,taster_price:trial==='taster'?+$('#tp_taster').value:null,lesson_mode:mode,area:mode==='online'?null:area,photo_url:photo};
   if(ME.tutor)await sb(`/rest/v1/tutors?id=eq.${ME.uid}`,{method:'PATCH',body:row,prefer:'return=minimal'});
   else{await sb('/rest/v1/tutors',{method:'POST',body:{id:ME.uid,...row},prefer:'return=minimal'});notify('Pioneer profile ready for approval: '+name,{Type:'Profile awaiting approval',Name:name,PioneerType:PTYPES[type],Email:ME.email})}
   const wasLive=ME.tutor?.status==='approved';NEWPHOTO=null;await refreshMe();
   if(wasLive&&ME.tutor.status==='pending')notify('Pioneer profile changed, needs re-check: '+name,{Type:'Profile re-check',Name:name,Email:ME.email});
   TUTORS=null;LOAD.tutors=null;ACC_TAB=ME.priv?'profile':'private';render();scrollTo(0,0);toast(ME.priv?'Profile saved':'Profile saved. Now add your private details.')});break}
 case'sb_tpriv':{const row={id:ME.uid,full_name:fv(f,'pv_name'),email:ME.email,phone:fv(f,'pv_phone'),postcode:fv(f,'pv_post').toUpperCase(),date_of_birth:fv(f,'pv_dob')||null,zoom_link:fv(f,'pv_zoom')||null,referees:[0,1].map(i=>({name:fv(f,'rf_n'+i),email:fv(f,'rf_e'+i),how:fv(f,'rf_h'+i)})).filter(r=>r.name||r.email),updated_at:new Date().toISOString()};
  if(!row.full_name||!row.phone){toast('Add your full name and phone');return}
  if(row.referees.some(r=>!r.name||!emailOK(r.email))){toast('Add a name and a valid email for each referee');return}
  if(row.zoom_link&&!VIDEO_RE.test(row.zoom_link)){toast('Please paste a Microsoft Teams, Google Meet or Zoom meeting link starting https://');return}
  await busy(btn,()=>sb('/rest/v1/tutor_private',{method:'POST',body:row,prefer:'resolution=merge-duplicates,return=minimal'}));await refreshMe();render();toast('Private details saved');break}
 case'sb_fam':{const row={full_name:fv(f,'fd_name'),area:fv(f,'fd_area')||null,phone:fv(f,'fd_phone')||null,updated_at:new Date().toISOString()};if(row.full_name.length<2){toast('Add your full name');return}
  await busy(btn,()=>sb(`/rest/v1/families?id=eq.${ME.uid}`,{method:'PATCH',body:row,prefer:'return=minimal'}));await refreshMe();render();toast('Details saved');break}
 case'sb_learner':{const lid=f.dataset.id,age=+fv(f,'ln_age');const row={first_name:fv(f,'ln_name'),age:age||null,school_year:fv(f,'ln_year')||null,subjects:vals(f,'ln_subj'),needs:vals(f,'ln_needs'),needs_notes:$('#ln_notes').value.trim()||null,share_needs:$('#ln_share').checked};
  if(!row.first_name){toast('Add the learner’s first name');return}if(age&&(age<4||age>25)){toast('NeuroScholarly supports ages 4–25');return}
  await busy(btn,()=>lid?sb(`/rest/v1/learners?id=eq.${lid}`,{method:'PATCH',body:row,prefer:'return=minimal'}):sb('/rest/v1/learners',{method:'POST',body:{family_id:ME.uid,...row},prefer:'return=minimal'}));
  EDIT_LEARNER=null;await refreshMe();render();toast(lid?'Saved':'Learner added');break}
 case'sb_req':{const tid=f.dataset.tutor,t=findTutor(tid);let lid=$('#rq_learner').value;const subj=fv(f,'rq_subject'),msg=$('#rq_msg').value.trim();
  if(lid==='new'){const n=fv(f,'rq_lname'),a=+fv(f,'rq_lage');if(!n){toast('Add the learner’s first name');return}if(a&&(a<4||a>25)){toast('NeuroScholarly supports ages 4–25');return}}
  if(!subj){toast('Choose a subject');return}if(CONTACT_RE.test(msg)){toast('Please remove phone numbers, emails and social media. You can message safely once you’ve sent the request.');return}
  if(!$('#rq_safe').checked){toast('Please tick the safeguarding box');return}
  await busy(btn,async()=>{if(lid==='new'){const rows=await sb('/rest/v1/learners',{method:'POST',body:{family_id:ME.uid,first_name:fv(f,'rq_lname'),age:+fv(f,'rq_lage')||null,subjects:[subj]},prefer:'return=representation'});lid=rows[0].id}
   const made=await sb('/rest/v1/requests',{method:'POST',body:{learner_id:lid,tutor_id:tid,subject:subj,trial_type:$('#rq_trial').value,message:msg||null},prefer:'return=representation'});if(made&&made[0])alertEmail('request',made[0].id);
   notify('New tutor request: '+(t?.display_name||'')+' – '+subj,{Type:'Tutor request (account)',Tutor:t?.display_name,Subject:subj,Family:ME.family.full_name,Email:ME.email});
   await refreshMe();ACC_TAB='requests';go('account');toast('Request sent to '+firstName(t?.display_name)+'. We’ll let them know.')},'Sending…');break}
 case'sb_doc':{const fl=$('#dc_file').files[0],kind=$('#dc_kind').value;if(!fl){toast('Choose a file first');return}
  if(fl.size>10*1024*1024){toast('That file is over 10 MB. Please choose a smaller one, or take a photo instead.');return}
  const type=fl.type||(/\.pdf$/i.test(fl.name)?'application/pdf':'image/jpeg');if(!/^(application\/pdf|image\/(jpeg|png|webp|heic|heif))$/.test(type)){toast('Please upload a PDF or a photo (JPG or PNG).');return}
  const ext=(fl.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg',path=`${ME.uid}/${kind}-${Date.now()}.${ext}`;
  const hadAll=!docsMissing().length;
  await busy(btn,async()=>{await sb('/storage/v1/object/tutor-docs/'+path,{method:'POST',body:fl,headers:{'Content-Type':type,'x-upsert':'false'}});
   await sb('/rest/v1/tutor_documents',{method:'POST',body:{kind,path,file_name:fl.name.slice(0,200),size_bytes:fl.size},prefer:'return=minimal'})},'Uploading…');
  await refreshMe();render();toast(DOCSHORT[kind]+' uploaded securely');
  if(!hadAll&&!docsMissing().length)notify('Documents ready to check: '+(ME.tutor?.display_name||ME.email),{Type:'Pioneer documents uploaded',Name:ME.priv?.full_name||ME.name,Email:ME.email});break}
 case'sb_av':{const day=+$('#av_day').value,fr=$('#av_from').value,to=$('#av_to').value;if(to<=fr){toast('The end time must be after the start time');return}
  if((ME.avail||[]).some(a=>a.weekday===day&&hhmm(a.start_time)<to&&hhmm(a.end_time)>fr)){toast('That overlaps a time you’ve already added');return}
  await busy(btn,()=>sb('/rest/v1/tutor_availability',{method:'POST',body:{weekday:day,start_time:fr,end_time:to},prefer:'return=minimal'}),'Adding…');await refreshMe();render();toast(DAYN[day]+' '+fr+'–'+to+' added');break}
 case'sb_book':{const note=$('#bk_note').value.trim();if(!BK.slot){toast('Choose a time');return}if(CONTACT_RE.test(note)){toast('Please remove phone numbers, emails and social media from your note');return}
  const reqId=f.dataset.req;let sid;
  try{sid=await busy(btn,()=>rpc('book_session',{req:reqId,start_at:BK.slot,mins:SMINS[BK.kind],lesson_mode:BK.mode,booking_note:note||null}),'Sending…')}catch(e){LOAD['book:'+reqId]=null;BK.slot='';render();return}
  alertEmail('booked',null,sid);const when=fmtWhen(BK.slot);BK={kind:'',mode:'',day:'',slot:''};LOAD['book:'+reqId]=null;await refreshMe();ACC_TAB='sessions';go('account');toast('Booking sent for '+when+'. You’ll get an email when it’s confirmed.');break}
 case'sb_send':{const ta=$('#ms_body'),body=ta.value.trim(),id=current.slice(7);if(!body)return;if(CONTACT_RE.test(body)){toast('For everyone’s safety, please don’t share phone numbers, emails or social media. Keep messages on NeuroScholarly.');return}
  await busy(btn,()=>sb('/rest/v1/messages',{method:'POST',body:{request_id:id,body},prefer:'return=minimal'}),'Sending…');alertEmail('message',id);ta.value='';await loadThread(id);render();break}
 }}catch(err){}
},true);

/* ---- returning from email links (confirm / reset) ---- */
async function bootAuth(){const raw=(location.hash||'').slice(1);
 if(/(^|&)(access_token|error_description)=/.test(raw)){const q=new URLSearchParams(raw);try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(q.get('error_description')){current='login';render();toast(/expired|invalid/i.test(q.get('error_description'))?'That link has expired. Please log in, or ask for a new link.':q.get('error_description').replace(/\+/g,' '));return true}
  setSession({access_token:q.get('access_token'),refresh_token:q.get('refresh_token'),expires_in:q.get('expires_in'),expires_at:q.get('expires_at')});
  try{SESSION.user=await sb('/auth/v1/user');ss.set('ns_session',SESSION);USER={role:SESSION.user.user_metadata?.role||'family'}}catch(e){resetAccount();current='login';render();toast(e.message);return true}
  const type=q.get('type');if(type==='recovery'){current='newpw';render();return true}
  const nx=ss.get('ns_after_login');ss.set('ns_after_login',null);current=nx||'account';render();toast('Email confirmed. Welcome to NeuroScholarly!');return true}
 return false}
addEventListener('hashchange',()=>{if(/(^|&)(access_token|error_description)=/.test((location.hash||'').slice(1)))bootAuth()});
SESSION=ss.get('ns_session');if(SESSION?.access_token)USER={role:SESSION.user?.user_metadata?.role||'family'};else SESSION=null;

/* boot */
(async()=>{if(await bootAuth())return;const h=(location.hash||'').slice(1);current=(VIEWS[h]||/^(pt|preq|thread)-/.test(h))?h:'home';render()})();
</script>
